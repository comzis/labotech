services:
  labotech:
    build: .
    container_name: labotech
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    env_file:
      - docker-env.txt
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- \"http://$${API_HOST:-10.67.18.29}:$${API_PORT:-4000}/health\" >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
