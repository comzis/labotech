services:
  labotech:
    build: .
    container_name: labotech
    network_mode: host
    cpus: ${LABOTECH_CPUS:-4.0}
    mem_limit: ${LABOTECH_MEM_LIMIT:-4096m}
    shm_size: ${LABOTECH_SHM_SIZE:-512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    env_file:
      - docker-env.txt
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- \"http://$${API_HOST:-10.67.18.29}:$${API_PORT:-4000}/health\" >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
