version: '3.8'

services:
  labotech:
    build: .
    container_name: labotech
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    env_file:
      - docker-env.txt
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:4000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
