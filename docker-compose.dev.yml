version: '3.8'

services:
  labotech:
    build:
      context: .
      target: dev
    container_name: labotech-dev
    network_mode: host
    cpus: 2.0
    mem_limit: 2048m
    shm_size: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./src:/app/src
      - ./routes:/app/routes
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: npx nodemon src/index.js
    restart: unless-stopped
